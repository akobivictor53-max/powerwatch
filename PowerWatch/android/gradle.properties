org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend base URL used by the app. Point this at your deployed backend.
# This is NOT a secret — it's a public HTTPS endpoint, safe to ship in the app.
POWERWATCH_BACKEND_BASE_URL=https://your-backend.example.com/

# App client key — must match APP_CLIENT_KEY on the backend .env.
# This is a low-sensitivity "who is calling my backend" key, NOT the Sogo
# secret key. It still shouldn't be treated as fully secret in a shipped
# APK (anything in an APK can be extracted), but its blast radius is
# limited to "someone can call your backend's rate-limited endpoints" —
# it never grants access to Sogo directly.
POWERWATCH_APP_CLIENT_KEY=REPLACE_WITH_SAME_VALUE_AS_BACKEND_ENV
