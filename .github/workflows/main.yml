name: Build PowerWatch APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_POWERWATCH_BACKEND_BASE_URL: ${{ secrets.POWERWATCH_BACKEND_BASE_URL }}
          ORG_GRADLE_PROJECT_POWERWATCH_APP_CLIENT_KEY: ${{ secrets.POWERWATCH_APP_CLIENT_KEY }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerWatch-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
